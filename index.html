<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TerraNauta AR</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- CAMARA -->

    <video
        id="camera"
        autoplay
        playsinline
    ></video>



    <!-- ESCENA -->

    <div id="scene">


        <!-- TERRANAUTA ARRIBA -->

        <img
            id="terranautaIdle"
            src="mcsaludando.png"
            alt="Terranauta"
        >



        <!-- TERRANAUTA INTERACCION -->

        <img
            id="terranautaAction"
            src="piojo.png"
            alt="Terranauta accion"
        >




        <!-- BOTELLA -->

        <img
            class="trash"
            id="botella"
            src="basura.png"
            alt="Botella"
        >




        <!-- BOLSA -->

        <img
            class="trash"
            id="bolsa"
            src="basura.png"
            alt="Bolsa"
        >




        <!-- LATA -->

        <img
            class="trash"
            id="lata"
            src="basura.png"
            alt="Lata"
        >




        <!-- PAPEL -->

        <img
            class="trash"
            id="papel"
            src="basura.png"
            alt="Papel"
        >

    </div>



    <script src="script.js"></script>

</body>

</html>
